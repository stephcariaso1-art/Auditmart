<div class="relative w-full min-h-screen p-6 bg-[#070706] text-[#C7C7C6] flex flex-col justify-between select-none animate-fade-in overflow-hidden">

  <div class="absolute inset-0 pointer-events-none overflow-hidden opacity-[0.06] z-0">
    <img src="assets/products/sony-wh1000.jpg" alt="" class="absolute -top-10 -right-16 w-60 h-60 object-cover rounded-full rotate-12 filter grayscale blur-[1px]" />
    <img src="assets/products/airpods-pro.jpg" alt="" class="absolute top-1/3 -left-16 w-52 h-52 object-cover rounded-full -rotate-12 filter grayscale blur-[1px]" />
    <img src="assets/products/jbl-flip6.jpg" alt="" class="absolute bottom-12 -right-12 w-48 h-48 object-cover rounded-full rotate-6 filter grayscale blur-[1px]" />
  </div>

  <div class="relative z-10 flex items-center justify-end pt-2">
    <button
      type="button"
      (click)="goHome()"
      class="text-xs text-[#C7C7C6] hover:text-white font-medium px-3.5 py-1.5 rounded-full bg-[#151413] border border-[#363534] hover:bg-[#363534] transition-colors cursor-pointer">
      Explore as Guest
    </button>
  </div>

  <div class="relative z-10 flex flex-col items-center text-center my-auto py-6 space-y-6 w-full max-w-sm mx-auto">

    <div class="w-20 h-20 rounded-full bg-[#151413] border border-[#363534] flex items-center justify-center shadow-lg">
      <div class="w-12 h-12 rounded-full bg-[#C7C7C6] flex items-center justify-center">
        <app-icon name="headphones" [size]="22" color="#070706" [strokeWidth]="2.5"></app-icon>
      </div>
    </div>

    <div class="space-y-1">
      <h2 class="text-2xl font-black text-white tracking-tight">Sign in to audiMart</h2>
      <p class="text-xs text-[#C7C7C6]">Enter your email to continue shopping audio gear</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="w-full space-y-4 text-left">

      <div class="space-y-1.5">
        <label class="text-xs font-bold text-[#C7C7C6] pl-2">Email Address</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Enter your email"
          required
          class="w-full px-5 py-4 rounded-2xl bg-[#0F0E0D] border border-[#363534] text-white placeholder-[#7C7B7B] text-sm focus:outline-none focus:border-[#C7C7C6] transition-colors" />
      </div>

      @if (errorMessage) {
        <p class="text-xs text-rose-400 pl-2">{{ errorMessage }}</p>
      }

      <div class="pt-2">
        <button
          type="submit"
          class="w-full py-4 rounded-full chrome-btn font-extrabold text-sm tracking-wide shadow-xl active:scale-[0.98] transition-all cursor-pointer">
          Continue
        </button>
      </div>

    </form>

  </div>

  <div class="relative z-10 text-center pb-4 text-xs text-[#A1A1A1]">
    Don't have an account?
    <a [routerLink]="['/signup']" class="text-white font-bold underline hover:text-[#C7C7C6] ml-1 cursor-pointer">Sign Up</a>
  </div>

</div>
