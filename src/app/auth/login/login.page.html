<div class="relative w-full min-h-screen p-6 bg-[#141416] text-white flex flex-col justify-between select-none animate-fade-in overflow-hidden">

  <div class="absolute inset-0 pointer-events-none overflow-hidden opacity-[0.06] z-0">

    <img src="assets/products/sony-wh1000.jpg" alt="" class="absolute -top-10 -right-16 w-60 h-60 object-cover rounded-full rotate-12 filter grayscale blur-[1px]" />

    <img src="assets/products/airpods-pro.jpg" alt="" class="absolute top-1/3 -left-16 w-52 h-52 object-cover rounded-full -rotate-12 filter grayscale blur-[1px]" />

    <img src="assets/products/jbl-flip6.jpg" alt="" class="absolute bottom-12 -right-12 w-48 h-48 object-cover rounded-full rotate-6 filter grayscale blur-[1px]" />
  </div>

  <div class="relative z-10 flex items-center justify-between pt-2">
    <button
      (click)="goBack()"
      class="w-10 h-10 rounded-full flex items-center justify-center text-white/80 hover:text-white bg-white/5 active:scale-95 transition-all">
      <app-icon name="arrow-left" [size]="20" color="#FFFFFF"></app-icon>
    </button>
    <button
      (click)="goHome()"
      class="text-xs text-white/60 hover:text-white font-medium px-3 py-1.5 rounded-full bg-white/5 transition-colors">
      Explore as Guest
    </button>
  </div>

  <div class="relative z-10 flex flex-col items-center text-center my-auto py-6 space-y-6 w-full max-w-sm mx-auto">

    <div class="w-20 h-20 rounded-full bg-[#232328] border border-white/10 flex items-center justify-center shadow-lg">
      <div class="w-12 h-12 rounded-full bg-white flex items-center justify-center">
        <app-icon name="headphones" [size]="22" color="#141416" [strokeWidth]="2.5"></app-icon>
      </div>
    </div>

    <div class="space-y-1">
      <h2 class="text-2xl font-black text-white tracking-tight">Sign in to audiMart</h2>
      <p class="text-xs text-[#8E8E93]">Enter your email to continue shopping audio gear</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="w-full space-y-4 text-left">

      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-white/80 pl-2">Email Address</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Enter your email"
          required
          class="w-full px-5 py-4 rounded-2xl bg-[#232328] border border-white/10 text-white placeholder-white/30 text-sm focus:outline-none focus:border-white/40 transition-colors" />
      </div>

      @if (errorMessage) {
        <p class="text-xs text-red-400 pl-2">{{ errorMessage }}</p>
      }

      <div class="pt-2">
        <button
          type="submit"
          class="w-full py-4 rounded-full bg-white text-black font-extrabold text-sm tracking-wide shadow-xl hover:bg-neutral-200 active:scale-[0.98] transition-all cursor-pointer">
          Continue
        </button>
      </div>

    </form>

  </div>

  <div class="relative z-10 text-center pb-4 text-xs text-white/50">
    Don't have an account?
    <a [routerLink]="['/signup']" class="text-white font-bold underline hover:text-white/80 ml-1 cursor-pointer">Sign Up</a>
  </div>

</div>
