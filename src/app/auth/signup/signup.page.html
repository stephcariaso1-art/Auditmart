<div class="w-full min-h-screen p-6 bg-[#070706] text-[#C7C7C6] flex flex-col justify-between select-none animate-fade-in">

  <div class="flex items-center justify-between pt-2">
    <button
      (click)="goBack()"
      class="w-10 h-10 rounded-full flex items-center justify-center text-[#C7C7C6] bg-[#151413] border border-[#363534] active:scale-95 transition-all">
      <app-icon name="arrow-left" [size]="20" color="#C7C7C6"></app-icon>
    </button>
    <button
      (click)="goGuest()"
      class="text-xs text-[#C7C7C6] hover:text-white font-medium px-3.5 py-1.5 rounded-full bg-[#151413] border border-[#363534] transition-colors cursor-pointer">
      Explore as Guest
    </button>
  </div>

  <div class="w-full max-w-sm mx-auto my-auto py-4 space-y-6">

    <div class="space-y-1 text-center">
      <h1 class="text-2xl font-black text-white tracking-tight">Join audiMart</h1>
      <p class="text-xs text-[#C7C7C6]">Set up your credentials to start browsing</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-4">

      <div class="space-y-1.5">
        <label class="text-xs font-bold text-[#C7C7C6] pl-2">Email Address</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="alex.rivera@audiomart.io"
          required
          class="w-full px-5 py-3.5 rounded-2xl bg-[#0F0E0D] border border-[#363534] text-white placeholder-[#7C7B7B] text-sm focus:outline-none focus:border-[#C7C7C6] transition-colors" />
      </div>

      <div class="space-y-1.5">
        <label class="text-xs font-bold text-[#C7C7C6] pl-2">Create Password</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Create password"
          required
          class="w-full px-5 py-3.5 rounded-2xl bg-[#0F0E0D] border border-[#363534] text-white placeholder-[#7C7B7B] text-sm focus:outline-none focus:border-[#C7C7C6] transition-colors" />
      </div>

      <div class="space-y-1.5">
        <label class="text-xs font-bold text-[#C7C7C6] pl-2">Re-enter Password</label>
        <input
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="Confirm password"
          required
          class="w-full px-5 py-3.5 rounded-2xl bg-[#0F0E0D] border border-[#363534] text-white placeholder-[#7C7B7B] text-sm focus:outline-none focus:border-[#C7C7C6] transition-colors" />
      </div>

      @if (errorMessage) {
        <p class="text-xs text-rose-400 pl-2">{{ errorMessage }}</p>
      }

      <div class="pt-3">
        <button
          type="submit"
          class="w-full py-4 rounded-full chrome-btn font-extrabold text-sm tracking-wide shadow-xl active:scale-[0.98] transition-all cursor-pointer">
          Enter
        </button>
      </div>

    </form>

  </div>

  <div class="text-center pb-4 text-xs text-[#A1A1A1]">
    Already have an account?
    <a [routerLink]="['/login']" class="text-white font-bold underline hover:text-[#C7C7C6] ml-1 cursor-pointer">Sign In</a>
  </div>

</div>
