<div
  [routerLink]="['/product', product.id]"
  class="group relative w-full min-h-[140px] bg-[#222226] hover:bg-[#28282D] active:scale-[0.985] rounded-[28px] px-5 py-4 flex items-center justify-between border border-white/[0.06] transition-all duration-200 cursor-pointer overflow-hidden shadow-md select-none">

  <div class="flex flex-col justify-between h-full z-10 flex-1 min-w-0 pr-3 py-0.5">
    <div>
      <h3 class="tracking-tight leading-snug flex items-baseline gap-1.5 flex-wrap truncate">
        <span class="text-[15px] font-black text-white">{{ product.brand }}</span>
        <span class="text-[14px] font-medium text-white/90 truncate">{{ getModel(product) }}</span>
      </h3>
      <p class="text-[11px] text-[#8E8E93] mt-1 font-medium truncate">
        {{ product.subtitle }}
      </p>
    </div>

    <div class="pt-2">
      <span class="inline-flex items-center justify-center px-4 py-1.5 rounded-full bg-[#34343A] text-white text-xs font-bold tracking-wide border border-white/5 group-hover:bg-white group-hover:text-black transition-colors shadow-xs tabular-nums">
        ₱{{ product.price }}
      </span>
    </div>
  </div>

  <div class="relative w-28 h-28 rounded-2xl overflow-hidden flex items-center justify-center shrink-0 -mr-1 bg-[#1A1A1E] border border-white/10 shadow-inner">
    <img
      [src]="product.images[0]"
      [alt]="product.name"
      class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-300"
      loading="lazy" />
  </div>

</div>
