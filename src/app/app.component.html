<div class="app-viewport-wrapper">

  <div class="mobile-stage-frame">

    @if (showSplash()) {
      <div
        class="fixed inset-0 z-[100] max-w-[430px] mx-auto bg-[#141416] text-white flex flex-col items-center justify-center p-8 select-none overflow-hidden transition-opacity duration-300"
        [ngClass]="isSplashFading() ? 'opacity-0 pointer-events-none' : 'opacity-100'">

        <div class="flex flex-col items-center justify-center text-center animate-splash-logo">

          <div class="w-24 h-24 rounded-full bg-[#202024] border border-white/10 flex items-center justify-center shadow-xl">
            <div class="w-16 h-16 rounded-full bg-white flex items-center justify-center shadow-md">
              <app-icon name="headphones" [size]="32" color="#141416" [strokeWidth]="2.5"></app-icon>
            </div>
          </div>

          <div class="mt-6 space-y-1.5">
            <h1 class="text-3xl font-black tracking-tight text-white flex items-center justify-center gap-0.5 font-sans">
              <span>audi</span><span class="text-white/60 font-semibold">Mart</span>
            </h1>
            <p class="text-xs text-[#8E8E93] font-medium tracking-wide">
              Premium Audio & Acoustics
            </p>
          </div>

          <div class="w-32 h-1 bg-[#232328] rounded-full overflow-hidden mt-8">
            <div class="h-full bg-white rounded-full animate-splash-progress"></div>
          </div>

        </div>

      </div>
    }

    <main class="w-full flex-1 relative overflow-x-hidden">
      <router-outlet></router-outlet>
    </main>

    @if (shouldShowTabBar()) {
      <app-tabbar></app-tabbar>
    }

    @if (cart.toastMessage()) {
      <div class="fixed top-6 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full bg-white text-black font-bold text-xs shadow-2xl flex items-center gap-2 animate-fade-in border border-black/10 select-none">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        <span>{{ cart.toastMessage() }}</span>
      </div>
    }

  </div>

</div>
