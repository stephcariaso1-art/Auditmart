<div class="app-viewport-wrapper">

  <div class="mobile-stage-frame">

    @if (showSplash()) {
      <div
        class="fixed inset-0 z-[100] max-w-[430px] mx-auto bg-[#141416] text-white flex flex-col justify-between p-8 select-none overflow-hidden transition-opacity duration-300"
        [ngClass]="isSplashFading() ? 'opacity-0 pointer-events-none' : 'opacity-100'">

        <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
          <div class="w-80 h-80 rounded-full bg-white/[0.04] blur-3xl"></div>
        </div>

        <div class="w-full flex justify-end pt-3 z-10">
          <button
            type="button"
            (click)="closeSplash()"
            class="text-xs text-white/50 hover:text-white px-3.5 py-1.5 rounded-full border border-white/10 active:scale-95 transition-all cursor-pointer">
            Skip
          </button>
        </div>

        <div class="flex flex-col items-center justify-center text-center space-y-6 my-auto z-10" (click)="closeSplash()">

          <div class="relative w-40 h-40 flex items-center justify-center">
            <div class="absolute inset-0 rounded-full border border-white/20 animate-acoustic-1 pointer-events-none"></div>
            <div class="absolute inset-0 rounded-full border border-white/15 animate-acoustic-2 pointer-events-none"></div>
            <div class="absolute inset-0 rounded-full border border-white/10 animate-acoustic-3 pointer-events-none"></div>

            <div class="relative w-28 h-28 rounded-full bg-gradient-to-b from-[#2A2A32] to-[#18181C] flex items-center justify-center border border-white/20 shadow-[0_0_50px_rgba(255,255,255,0.18)] animate-logo-float">
              <div class="w-18 h-18 rounded-full bg-white flex items-center justify-center shadow-2xl">
                <app-icon name="headphones" [size]="36" color="#141416" [strokeWidth]="2.3"></app-icon>
              </div>
            </div>
          </div>

          <div class="flex items-end justify-center gap-1.5 h-8 pt-1">
            <span class="w-1 bg-white/70 rounded-full eq-bar-1"></span>
            <span class="w-1 bg-white/90 rounded-full eq-bar-2"></span>
            <span class="w-1 bg-white rounded-full eq-bar-3"></span>
            <span class="w-1 bg-white/50 rounded-full eq-bar-4"></span>
            <span class="w-1 bg-white/80 rounded-full eq-bar-5"></span>
            <span class="w-1 bg-white/60 rounded-full eq-bar-6"></span>
            <span class="w-1 bg-white/85 rounded-full eq-bar-7"></span>
          </div>

          <div class="space-y-2">
            <h1 class="text-3xl font-black tracking-tight text-white flex items-center justify-center gap-1 font-sans">
              <span>audi</span><span class="text-white/60 font-semibold">Mart</span>
            </h1>
            <p class="text-[11px] text-[#8E8E93] tracking-[0.25em] uppercase font-semibold">
              Premium Audio Gear & Acoustics
            </p>
          </div>

          <div class="w-52 space-y-2 pt-1">
            <div class="w-full h-1.5 bg-[#25252A] rounded-full overflow-hidden">
              <div class="h-full bg-white rounded-full animate-progress-fill"></div>
            </div>
            <p class="text-[10px] text-white/40 font-mono tracking-wider">Tuning acoustics...</p>
          </div>

        </div>

        <div class="w-full max-w-xs mx-auto pb-4 z-10">
          <button
            type="button"
            (click)="closeSplash()"
            class="w-full py-3.5 rounded-full bg-white text-black font-extrabold text-sm tracking-wide shadow-xl hover:bg-neutral-200 active:scale-[0.98] transition-all flex items-center justify-center gap-2 cursor-pointer">
            <span>Explore audiMart</span>
            <app-icon name="arrow-right" [size]="16" color="#000000" [strokeWidth]="2.5"></app-icon>
          </button>
        </div>

      </div>
    }

    <main class="w-full flex-1 relative overflow-x-hidden">
      <router-outlet></router-outlet>
    </main>

    @if (shouldShowTabBar()) {
      <app-tabbar></app-tabbar>
    }

    @if (cart.toastMessage()) {
      <div class="fixed top-6 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full bg-white text-black font-bold text-xs shadow-2xl flex items-center gap-2 animate-fade-in border border-black/10 select-none">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        <span>{{ cart.toastMessage() }}</span>
      </div>
    }

  </div>

</div>
