<div class="w-full h-full min-h-screen flex flex-col items-center justify-center p-8 bg-[#141416] select-none text-white animate-fade-in relative overflow-hidden">

  <div class="flex flex-col items-center justify-center text-center animate-splash-logo">

    <div class="w-24 h-24 rounded-full bg-[#202024] border border-white/10 flex items-center justify-center shadow-xl">
      <div class="w-16 h-16 rounded-full bg-white flex items-center justify-center shadow-md">
        <app-icon name="headphones" [size]="32" color="#141416" [strokeWidth]="2.5"></app-icon>
      </div>
    </div>

    <div class="mt-6 space-y-1.5">
      <h1 class="text-3xl font-black tracking-tight text-white flex items-center justify-center gap-0.5 font-sans">
        <span>audi</span><span class="text-white/60 font-semibold">Mart</span>
      </h1>
      <p class="text-xs text-[#8E8E93] font-medium tracking-wide">
        Premium Audio & Acoustics
      </p>
    </div>

    <div class="w-32 h-1 bg-[#232328] rounded-full overflow-hidden mt-8">
      <div class="h-full bg-white rounded-full animate-splash-progress"></div>
    </div>

  </div>

</div>
