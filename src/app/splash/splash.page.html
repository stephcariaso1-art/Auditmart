<div class="w-full h-full min-h-screen flex flex-col items-center justify-between p-8 bg-[#141416] select-none text-white animate-fade-in relative overflow-hidden">

  <div class="absolute -top-32 left-1/2 -translate-x-1/2 w-96 h-96 rounded-full bg-white/[0.03] blur-3xl pointer-events-none"></div>

  <div class="w-full flex justify-end pt-4 z-10">
    <button
      (click)="continue()"
      class="text-xs text-white/50 hover:text-white transition-colors px-3.5 py-1.5 rounded-full border border-white/10 active:scale-95 cursor-pointer">
      Skip
    </button>
  </div>

  <div class="flex flex-col items-center justify-center text-center space-y-6 my-auto z-10">

    <div class="relative w-36 h-36 flex items-center justify-center">
      <div class="absolute inset-0 rounded-full border border-white/20 animate-acoustic-1 pointer-events-none"></div>
      <div class="absolute inset-0 rounded-full border border-white/15 animate-acoustic-2 pointer-events-none"></div>
      <div class="absolute inset-0 rounded-full border border-white/10 animate-acoustic-3 pointer-events-none"></div>

      <div class="relative w-28 h-28 rounded-full bg-[#232328] flex items-center justify-center border border-white/15 shadow-[0_0_50px_rgba(255,255,255,0.12)] animate-logo-float">
        <div class="w-18 h-18 rounded-full bg-white flex items-center justify-center shadow-lg">
          <app-icon name="scanner" [size]="34" color="#141416" [strokeWidth]="2.5"></app-icon>
        </div>
      </div>
    </div>

    <div class="flex items-end justify-center gap-1.5 h-7 pt-1">
      <span class="w-1 bg-white/70 rounded-full eq-bar-1"></span>
      <span class="w-1 bg-white rounded-full eq-bar-2"></span>
      <span class="w-1 bg-white/80 rounded-full eq-bar-3"></span>
      <span class="w-1 bg-white/50 rounded-full eq-bar-4"></span>
      <span class="w-1 bg-white/90 rounded-full eq-bar-5"></span>
    </div>

    <div class="space-y-2">
      <h1 class="text-3xl font-black tracking-tight text-white flex items-center justify-center gap-1 font-sans">
        <span>audi</span><span class="text-white/60 font-semibold">Mart</span>
      </h1>
      <p class="text-xs text-[#8E8E93] tracking-widest uppercase font-semibold">
        Premium Audio Gear & Acoustics
      </p>
    </div>

    <div class="w-48 h-1.5 bg-[#25252A] rounded-full overflow-hidden mt-4">
      <div class="h-full bg-white rounded-full animate-progress-fill"></div>
    </div>

  </div>

  <div class="w-full max-w-xs pb-6 z-10">
    <button
      (click)="continue()"
      class="w-full py-4 rounded-full bg-white text-black font-extrabold text-sm tracking-wide shadow-xl hover:bg-neutral-200 active:scale-[0.98] transition-all flex items-center justify-center gap-2 cursor-pointer">
      <span>Get Started</span>
      <app-icon name="arrow-right" [size]="16" color="#000000" [strokeWidth]="2.5"></app-icon>
    </button>
  </div>

</div>
