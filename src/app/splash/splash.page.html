<div class="w-full h-full min-h-screen flex flex-col justify-between items-center p-8 bg-[#070706] select-none text-[#C7C7C6] animate-fade-in relative overflow-hidden">

  <!-- Ambient bottom floor glow / shadow using titanium palette -->
  <div class="absolute -bottom-16 left-1/2 -translate-x-1/2 w-[520px] h-72 rounded-full bg-black/95 blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-8 left-1/2 -translate-x-1/2 w-[440px] h-48 rounded-full bg-[#0B0A0A]/90 blur-2xl pointer-events-none"></div>
  <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-80 h-28 rounded-full bg-[#363534]/50 blur-xl pointer-events-none"></div>

  <div class="w-full pt-4"></div>

  <div class="flex flex-col items-center justify-center text-center animate-splash-logo z-10 my-auto">

    <div class="w-28 h-28 rounded-full bg-[#151413] border border-[#363534] flex items-center justify-center shadow-[0_25px_65px_rgba(0,0,0,0.85)] ring-4 ring-[#363534]/50 transition-transform hover:scale-105">
      <div class="w-18 h-18 rounded-full bg-[#C7C7C6] flex items-center justify-center shadow-2xl">
        <app-icon name="headphones" [size]="36" color="#070706" [strokeWidth]="2.5"></app-icon>
      </div>
    </div>

    <div class="mt-7 space-y-2">
      <h1 class="text-3xl font-black tracking-tight text-white flex items-center justify-center gap-0.5 font-sans">
        <span>audi</span><span class="text-[#C7C7C6] font-semibold">Mart</span>
      </h1>
      <p class="text-xs text-[#A1A1A1] font-medium tracking-wide">
        Premium Audio & Acoustics
      </p>
    </div>

    <div class="w-36 h-1 bg-[#151413] border border-[#363534] rounded-full overflow-hidden mt-8">
      <div class="h-full bg-[#C7C7C6] rounded-full animate-splash-progress"></div>
    </div>

  </div>

  <!-- Bottom action with extra-large prominent shadow -->
  <div class="w-full max-w-xs pb-6 z-20">
    <button
      type="button"
      (click)="continue()"
      class="w-full py-4 rounded-full bg-[#C7C7C6] text-[#070706] font-extrabold text-sm tracking-wide shadow-[0_25px_60px_rgba(0,0,0,0.95),0_12px_32px_rgba(199,199,198,0.35)] hover:shadow-[0_25px_60px_rgba(199,199,198,0.5)] hover:bg-white active:scale-[0.98] transition-all flex items-center justify-center gap-2 cursor-pointer border border-[#C7C7C6]">
      <span>Get Started</span>
      <app-icon name="arrow-right" [size]="16" color="#070706" [strokeWidth]="2.5"></app-icon>
    </button>
  </div>

</div>
